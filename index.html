<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vishal Kumar Bhakt — 3D Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ─────────── RESET & BASE ─────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: #e8e6f0;
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1200px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #6c5ce7;
            border-radius: 10px;
        }

        /* ─────────── UTILITY ─────────── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .section {
            padding: 80px 0 60px;
            transform-style: preserve-3d;
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #6c5ce7;
            margin-bottom: 6px;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .section-subtitle {
            color: #a8a4b8;
            font-size: 1.05rem;
            max-width: 560px;
            line-height: 1.7;
        }

        /* ─────────── NAVBAR ─────────── */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 16px 24px;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transform-style: preserve-3d;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .navbar .logo span {
            color: #6c5ce7;
        }

        .navbar .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .navbar .nav-links a {
            color: #a8a4b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #6c5ce7;
            transition: width 0.3s;
        }

        .navbar .nav-links a:hover {
            color: #fff;
        }
        .navbar .nav-links a:hover::after {
            width: 100%;
        }

        .navbar .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .navbar .menu-toggle span {
            width: 26px;
            height: 2px;
            background: #fff;
            border-radius: 4px;
            transition: 0.3s;
        }

        /* ─────────── HERO ─────────── */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            position: relative;
        }

        .hero .container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 60px;
            align-items: center;
            transform-style: preserve-3d;
        }

        .hero-left {
            transform-style: preserve-3d;
        }

        .hero-avatar {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 80px rgba(108, 92, 231, 0.25);
            transform: translateZ(60px);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s;
            user-select: none;
            border: 3px solid rgba(255, 255, 255, 0.06);
            position: relative;
            margin-bottom: 20px;
        }

        .hero-avatar::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #00cec9, #6c5ce7);
            background-size: 300% 300%;
            z-index: -1;
            animation: gradientSpin 6s ease-in-out infinite;
            filter: blur(20px);
            opacity: 0.4;
        }

        @keyframes gradientSpin {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .hero-avatar:hover {
            transform: translateZ(100px) scale(1.04);
            box-shadow: 0 0 120px rgba(108, 92, 231, 0.4);
        }

        .hero .greeting {
            font-size: 1rem;
            color: #6c5ce7;
            font-weight: 600;
            letter-spacing: 1px;
            transform: translateZ(30px);
        }

        .hero h1 {
            font-size: clamp(2.8rem, 5vw, 4.5rem);
            font-weight: 900;
            line-height: 1.1;
            margin: 8px 0 16px;
            transform: translateZ(40px);
            letter-spacing: -1px;
        }

        .hero h1 .highlight {
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero .tagline {
            font-size: 1.1rem;
            color: #a8a4b8;
            line-height: 1.8;
            max-width: 500px;
            transform: translateZ(20px);
        }

        .hero .cta-group {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            flex-wrap: wrap;
            transform: translateZ(30px);
        }

        .hero .cta-group a {
            padding: 14px 34px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .hero .cta-primary {
            background: linear-gradient(135deg, #6c5ce7, #4a3db8);
            color: #fff;
            box-shadow: 0 8px 40px rgba(108, 92, 231, 0.25);
        }

        .hero .cta-primary:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 16px 60px rgba(108, 92, 231, 0.4);
        }

        .hero .cta-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hero .cta-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-6px);
        }

        .hero .social-links {
            display: flex;
            gap: 16px;
            margin-top: 28px;
            transform: translateZ(20px);
        }

        .hero .social-links a {
            color: #a8a4b8;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero .social-links a:hover {
            background: #6c5ce7;
            color: #fff;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 40px rgba(108, 92, 231, 0.3);
            border-color: #6c5ce7;
        }

        /* Hero right – 3D floating elements */
        .hero-right {
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-right .tech-orbit {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            transform: translateZ(30px) rotateY(5deg);
            transition: transform 0.4s;
        }

        .hero-right .tech-orbit .orb-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateZ(0);
            cursor: default;
        }

        .hero-right .tech-orbit .orb-item:hover {
            transform: translateZ(40px) scale(1.06);
            background: rgba(108, 92, 231, 0.12);
            border-color: rgba(108, 92, 231, 0.2);
            box-shadow: 0 20px 50px rgba(108, 92, 231, 0.1);
        }

        .hero-right .tech-orbit .orb-item .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 6px;
        }

        .hero-right .tech-orbit .orb-item .label {
            font-size: 0.75rem;
            color: #a8a4b8;
            font-weight: 500;
        }

        /* ─────────── 3D CARD SYSTEM ─────────── */
        .card-3d {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: default;
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .card-3d::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(108, 92, 231, 0.08), transparent 60%);
            opacity: 0;
            transition: opacity 0.6s;
            pointer-events: none;
        }

        .card-3d:hover::before {
            opacity: 1;
        }

        .card-3d:hover {
            transform: translateY(-8px) translateZ(20px) rotateX(2deg);
            border-color: rgba(108, 92, 231, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .card-3d .icon {
            font-size: 2.2rem;
            margin-bottom: 14px;
            display: inline-block;
            transform: translateZ(10px);
            transition: transform 0.4s;
        }

        .card-3d:hover .icon {
            transform: translateZ(30px) scale(1.1);
        }

        .card-3d h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            transform: translateZ(8px);
            transition: transform 0.4s;
        }

        .card-3d:hover h3 {
            transform: translateZ(24px);
        }

        .card-3d .sub {
            color: #6c5ce7;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 10px;
            transform: translateZ(6px);
            transition: transform 0.4s;
        }

        .card-3d:hover .sub {
            transform: translateZ(18px);
        }

        .card-3d p,
        .card-3d li {
            color: #a8a4b8;
            font-size: 0.92rem;
            line-height: 1.7;
            transform: translateZ(4px);
            transition: transform 0.4s;
        }

        .card-3d:hover p,
        .card-3d:hover li {
            transform: translateZ(14px);
        }

        .card-3d ul {
            list-style: none;
            padding: 0;
        }

        .card-3d ul li {
            padding: 4px 0 4px 22px;
            position: relative;
        }

        .card-3d ul li::before {
            content: '✦';
            position: absolute;
            left: 0;
            color: #6c5ce7;
            font-size: 0.7rem;
            top: 7px;
        }

        /* ─────────── GRID ─────────── */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
            transform-style: preserve-3d;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            transform-style: preserve-3d;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            transform-style: preserve-3d;
        }

        /* ─────────── ABOUT ─────────── */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            transform-style: preserve-3d;
        }

        .about-content .card-3d {
            padding: 36px 32px;
        }

        .about-content .card-3d p {
            font-size: 1rem;
            line-height: 1.8;
        }

        /* ─────────── SKILLS ─────────── */
        .skill-tag {
            background: rgba(108, 92, 231, 0.1);
            border: 1px solid rgba(108, 92, 231, 0.06);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #e8e6f0;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            display: inline-block;
            cursor: default;
            font-weight: 400;
        }

        .skill-tag:hover {
            background: #6c5ce7;
            color: #fff;
            transform: translateY(-4px) scale(1.06);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.25);
            border-color: #6c5ce7;
        }

        .skill-group {
            margin-bottom: 20px;
        }
        .skill-group h4 {
            color: #6c5ce7;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .skill-group .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ─────────── PROJECTS ─────────── */
        .project-card .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0 14px;
        }

        .project-card .tech-stack span {
            background: rgba(0, 206, 201, 0.08);
            border: 1px solid rgba(0, 206, 201, 0.05);
            padding: 3px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            color: #00cec9;
            font-weight: 500;
        }

        .project-card .links {
            display: flex;
            gap: 18px;
            margin-top: 12px;
        }

        .project-card .links a {
            color: #a8a4b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .project-card .links a:hover {
            color: #6c5ce7;
            transform: translateX(4px);
        }

        /* ─────────── EXPERIENCE / TIMELINE ─────────── */
        .timeline-item {
            padding: 18px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .timeline-item:last-child {
            border-bottom: none;
        }

        .timeline-item .date {
            color: #6c5ce7;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .timeline-item h4 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin: 2px 0 4px;
        }

        .timeline-item .company {
            color: #a8a4b8;
            font-size: 0.9rem;
        }

        /* ─────────── INTERESTS ─────────── */
        .interest-item {
            text-align: center;
            padding: 20px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s;
            transform-style: preserve-3d;
        }

        .interest-item:hover {
            background: rgba(108, 92, 231, 0.06);
            border-color: rgba(108, 92, 231, 0.15);
            transform: translateY(-6px) translateZ(20px);
            box-shadow: 0 20px 50px rgba(108, 92, 231, 0.05);
        }

        .interest-item .emoji {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 6px;
        }

        .interest-item .label {
            color: #a8a4b8;
            font-size: 0.85rem;
        }

        /* ─────────── CONTACT ─────────── */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            transform-style: preserve-3d;
        }

        .contact-grid .card-3d {
            padding: 36px 32px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-item .emoji {
            font-size: 1.6rem;
            width: 44px;
            text-align: center;
        }

        .contact-item .info {
            color: #a8a4b8;
        }
        .contact-item .info strong {
            color: #fff;
            font-weight: 600;
            display: block;
            font-size: 0.9rem;
        }
        .contact-item .info span {
            font-size: 0.95rem;
        }

        /* ─────────── FOOTER ─────────── */
        footer {
            text-align: center;
            padding: 60px 0 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            color: #a8a4b8;
            font-size: 0.85rem;
        }

        /* ─────────── RESPONSIVE ─────────── */
        @media (max-width: 1024px) {
            .hero .container {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-left {
                order: 1;
            }
            .hero-right {
                order: 0;
            }
            .hero .tagline {
                margin: 0 auto;
            }
            .hero .cta-group {
                justify-content: center;
            }
            .hero .social-links {
                justify-content: center;
            }
            .hero-avatar {
                margin: 0 auto 20p
